# GuardLM SFT quickstart config — Qwen3-1.7B QLoRA on identity dataset
# Usage (inside WSL venv):
#   llamafactory-cli train /mnt/e/workspace_work/GuardLM/training/sft/qwen3-qlora-identity.yaml

### model
model_name_or_path: /root/models/Qwen3-1.7B

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
quantization_bit: 4

### dataset
dataset: identity
dataset_dir: /root/LLaMA-Factory/data
template: qwen3
cutoff_len: 1024
max_samples: 500
overwrite_cache: true

### output
output_dir: /root/saves/Qwen3-1.7B/qwen3-qlora-sft-m0-v3
logging_steps: 5
save_steps: 500
plot_loss: true
report_to: tensorboard

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
max_grad_norm: 1.0
